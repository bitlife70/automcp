# 생성물: ir/mcp-spec.yaml → MCP Toolbox 설정 (spike에서는 수작업 컴파일, 1단계에서 컴파일러로 자동화)
# 이 파일만으로 MCP 서버가 동작한다. 별도 서버 코드 없음.
kind: source
name: jpetstore-db
type: postgres
host: db
port: 5432
database: jpetstore
user: ${MCP_DB_USER}          # 최소권한 계정 mcp_reader (카드 컬럼 SELECT 권한 없음)
password: ${MCP_DB_PASSWORD}
---
kind: tool
name: search_products
type: postgres-sql
source: jpetstore-db
description: >-
  상품명을 키워드로 검색한다. 공백으로 구분한 여러 키워드는 OR 조건이다(대소문자 무시).
  상품의 가격·재고는 get_product_details로 이어서 조회한다.
parameters:
  - name: keyword
    type: string
    description: "검색어. 예: 'fish', 'golden retriever'"
# reuse: ProductMapper.searchProductList + CatalogService.searchProductList의 변환(소문자, 공백 분리, %키워드%)
statement: |
  SELECT DISTINCT p.productid AS product_id,
         p.name,
         p.category AS category_id,
         trim(regexp_replace(p.descn, '<[^>]*>', '', 'g')) AS description
  FROM product p
  WHERE lower(p.name) LIKE ANY (
    SELECT '%' || k || '%'
    FROM regexp_split_to_table(lower(trim($1)), '\s+') AS k
    WHERE k <> '')
  ORDER BY p.productid
  LIMIT 50
---
kind: tool
name: get_product_details
type: postgres-sql
source: jpetstore-db
description: >-
  상품 ID로 상품 정보와 판매 단위(item)별 가격, 재고 수량을 한 번에 조회한다.
parameters:
  - name: product_id
    type: string
    description: "상품 ID. 예: 'FI-SW-01' (search_products 결과의 product_id)"
# reuse: ItemMapper.getItemListByProduct + ItemMapper.getInventoryQuantity
statement: |
  SELECT p.productid AS product_id,
         p.name,
         i.itemid AS item_id,
         concat_ws(' ', i.attr1, i.attr2, i.attr3, i.attr4, i.attr5) AS variant,
         i.listprice AS list_price,
         v.qty AS stock_qty,
         i.status
  FROM item i
  JOIN product p ON p.productid = i.productid
  LEFT JOIN inventory v ON v.itemid = i.itemid
  WHERE i.productid = $1
  ORDER BY i.itemid
  LIMIT 50
---
kind: tool
name: list_customer_orders
type: postgres-sql
source: jpetstore-db
description: >-
  고객 ID(username)로 주문 목록을 조회한다(주문일 오름차순). 결제수단 정보는 반환하지 않는다.
parameters:
  - name: username
    type: string
    description: "고객 ID. 예: 'j2ee'"
# reuse: OrderMapper.getOrdersByUsername (카드 컬럼 제외, 상태 코드 → 의미)
statement: |
  SELECT o.orderid AS order_id,
         o.orderdate AS order_date,
         o.totalprice AS total_price,
         s.status,
         CASE s.status WHEN 'P' THEN '처리 대기(Pending)' ELSE s.status END AS status_name,
         o.courier,
         o.shipcity AS ship_city
  FROM orders o
  JOIN orderstatus s ON s.orderid = o.orderid
  WHERE o.userid = $1
  ORDER BY o.orderdate
  LIMIT 50
---
kind: tool
name: get_order
type: postgres-sql
source: jpetstore-db
description: >-
  주문 번호와 고객 ID로 주문 상세(배송지, 금액, 상태, 주문 품목)를 조회한다.
  주문 번호와 고객 ID가 일치하지 않으면 결과가 없다.
parameters:
  - name: order_id
    type: integer
    description: "주문 번호. 예: 1000"
  - name: username
    type: string
    description: "주문한 고객 ID. 본인 확인용"
# reuse: OrderMapper.getOrder + LineItemMapper.getLineItemsByOrderId
# guard: OrderController.viewOrder의 소유자 검증을 WHERE 조건(o.userid = $2)으로 재현
statement: |
  SELECT o.orderid AS order_id,
         o.userid AS username,
         o.orderdate AS order_date,
         CASE s.status WHEN 'P' THEN '처리 대기(Pending)' ELSE s.status END AS status_name,
         o.totalprice AS total_price,
         json_build_object(
           'name', o.shiptofirstname || ' ' || o.shiptolastname,
           'address', concat_ws(', ', o.shipaddr1, o.shipaddr2, o.shipcity, o.shipstate, o.shipzip, o.shipcountry)
         ) AS ship_to,
         (SELECT json_agg(json_build_object(
                   'line', l.linenum, 'item_id', l.itemid, 'product', p.name,
                   'quantity', l.quantity, 'unit_price', l.unitprice) ORDER BY l.linenum)
            FROM lineitem l
            JOIN item i ON i.itemid = l.itemid
            JOIN product p ON p.productid = i.productid
           WHERE l.orderid = o.orderid) AS lines
  FROM orders o
  JOIN orderstatus s ON s.orderid = o.orderid
  WHERE o.orderid = $1 AND o.userid = $2
---
kind: toolset
name: cs-agent
tools:
  - search_products
  - get_product_details
  - list_customer_orders
  - get_order

# automcp IR v0 — jpetstore 고객상담 에이전트
# 사람이 검토·승인하는 "설계서"이자 컴파일러의 입력이다.
# 모든 tool은 캡처 근거(trace)와 소스 근거(file:line)를 가져야 한다. 근거 없는 tool은 컴파일하지 않는다.

spec_version: automcp/v0
system:
  name: jpetstore
  source: targets/jpetstore-6
  capture: spike/capture/endpoint-map.json

agent:
  name: cs-agent
  persona: 고객 상담 직원이 상품·재고·주문을 빠르게 조회하도록 돕는 에이전트
  acts_as: cs_staff            # 최종 사용자 본인이 아니라 상담 직원 권한으로 동작 (→ 검토 질문 Q1)

defaults:
  side_effect: read
  runtime: toolbox             # MCP Toolbox (postgres-sql)
  source: jpetstore-db         # 최소권한 계정 mcp_reader 사용
  max_rows: 50

policies:
  excluded_columns:            # 출력 금지 + DB 컬럼 권한에서도 제외(spike/db/03-mcp-reader.sql)
    - orders.creditcard
    - orders.exprdate
    - orders.cardtype
  pii_output:                  # 출력은 허용하되 감사 로그·마스킹 대상
    - orders.billtofirstname
    - orders.billtolastname
    - orders.shipaddr1
  no_runtime_sql_generation: true

tools:
  - name: search_products
    use_case: UC-1 상품 검색
    side_effect: read
    description: >-
      상품명을 키워드로 검색한다. 공백으로 구분한 여러 키워드는 OR 조건이다(대소문자 무시).
      상품의 가격·재고는 get_product_details로 이어서 조회한다.
    input:
      keyword: { type: string, description: "검색어. 예: 'fish', 'golden retriever'" }
    output: [product_id, name, category_id, description]
    binding:
      kind: sql
      reuse: ProductMapper.searchProductList
      # 서비스 레이어에 숨은 변환 규칙. 캡처 바인딩 값('%fish%')과 CatalogService 소스로 확인.
      transforms: [lowercase, split_whitespace, wrap_like_percent]
      output_cleanup: { description: strip_html }   # 원본 DESCN에 <image> 태그가 섞여 있음
    evidence:
      capture: { step: UC-1/search-products, trace: 4f18448db61acef29e3ef88f7f30f0b9, observed_bind: ["%fish%"] }
      source:
        - src/main/java/org/mybatis/jpetstore/web/controllers/CatalogController.java:127
        - src/main/java/org/mybatis/jpetstore/service/CatalogService.java:111
        - src/main/resources/org/mybatis/jpetstore/mapper/ProductMapper.xml:46
    deviations:
      - 원본은 여러 키워드가 같은 상품에 매칭되면 중복 행을 반환하지만, tool은 중복을 제거한다.
    verify:
      golden: { step: UC-1/search-products, args: { keyword: fish }, compare: product_ids_in_page }

  - name: get_product_details
    use_case: UC-2 상품 상세·가격·재고
    side_effect: read
    description: >-
      상품 ID로 상품 정보와 판매 단위(item)별 가격, 재고 수량을 한 번에 조회한다.
    input:
      product_id: { type: string, description: "상품 ID. 예: 'FI-SW-01' (search_products 결과의 product_id)" }
    output: [product_id, name, item_id, variant, list_price, stock_qty, status]
    binding:
      kind: sql
      # 원본 화면은 두 번에 나눠 보여 주는 정보(상품 목록 화면 + 아이템 화면의 재고)를 한 tool로 합성한다.
      reuse: [ItemMapper.getItemListByProduct, ItemMapper.getInventoryQuantity]
    evidence:
      capture:
        - { step: UC-2/view-product, trace: c4508d02187d8c8af8e010af26935d63, observed_bind: ["FI-SW-01"] }
        - { step: UC-2/view-item, trace: 48474dfb3b2b2f721ad048daf2dad449, observed_bind: ["EST-1"] }
      source:
        - src/main/java/org/mybatis/jpetstore/web/controllers/CatalogController.java:87
        - src/main/resources/org/mybatis/jpetstore/mapper/ItemMapper.xml:26
        - src/main/resources/org/mybatis/jpetstore/mapper/ItemMapper.xml:70
    deviations:
      - 원가(unitcost)와 공급사(supplier)는 상담 용도에 불필요하므로 제외한다.
    verify:
      golden: { step: UC-2/view-product, args: { product_id: FI-SW-01 }, compare: item_ids_in_page }

  - name: list_customer_orders
    use_case: UC-3 고객 주문 내역 조회
    side_effect: read
    description: >-
      고객 ID(username)로 주문 목록을 조회한다(주문일 오름차순). 결제수단 정보는 반환하지 않는다.
    input:
      username: { type: string, description: "고객 ID. 예: 'j2ee'" }
    output: [order_id, order_date, total_price, status, status_name, courier, ship_city]
    binding:
      kind: sql
      reuse: OrderMapper.getOrdersByUsername
      code_mapping: { status: { P: "처리 대기(Pending)" } }   # Order.java:641 기본값 'P'
    evidence:
      capture: { step: UC-3/list-orders, trace: 381eff6a0c77f65887c9aba445f18802, observed_bind: ["j2ee"] }
      source:
        - src/main/java/org/mybatis/jpetstore/web/controllers/OrderController.java:75
        - src/main/resources/org/mybatis/jpetstore/mapper/OrderMapper.xml:59
    deviations:
      - 원본은 로그인 세션의 본인 주문만 보여 준다. tool은 상담 직원 권한으로 임의 고객을 조회한다(→ Q1).
    verify:
      golden: { step: UC-3/list-orders, args: { username: j2ee }, compare: order_ids_in_page }

  - name: get_order
    use_case: UC-3 주문 상세 조회
    side_effect: read
    description: >-
      주문 번호와 고객 ID로 주문 상세(배송지, 금액, 상태, 주문 품목)를 조회한다.
      주문 번호와 고객 ID가 일치하지 않으면 결과가 없다.
    input:
      order_id: { type: integer, description: "주문 번호. 예: 1000" }
      username: { type: string, description: "주문한 고객 ID. 본인 확인용" }
    output: [order_id, username, order_date, status_name, total_price, ship_to, lines]
    binding:
      kind: sql
      reuse: [OrderMapper.getOrder, LineItemMapper.getLineItemsByOrderId]
      # 원본 컨트롤러의 소유자 검증(order.username == 세션 사용자)을 SQL 조건으로 재현한다.
      guards: ["orders.userid = :username"]
      code_mapping: { status: { P: "처리 대기(Pending)" } }
    evidence:
      capture: { step: UC-3/view-order, trace: d0b93814b72328a447f4b3faf0cd4c89, observed_bind: ["1000"] }
      source:
        - src/main/java/org/mybatis/jpetstore/web/controllers/OrderController.java:222
        - src/main/resources/org/mybatis/jpetstore/mapper/OrderMapper.xml:26
        - src/main/resources/org/mybatis/jpetstore/mapper/LineItemMapper.xml:26
    verify:
      golden: { step: UC-3/view-order, args: { order_id: 1000, username: j2ee }, compare: order_total_in_page }

review:
  status: pending
  questions:
    - id: Q1
      to: 고객사 운영자/현업
      text: >-
        원본 시스템은 고객 본인만 자기 주문을 볼 수 있습니다. 상담 에이전트가 고객 ID만으로 다른 고객의 주문을
        조회하도록 허용할까요? 허용하지 않으면 MCP 게이트웨이에서 사용자 신원을 주입하는 방식으로 바꿔야 합니다.
    - id: Q2
      to: 고객사 운영자
      text: 주문 상태 코드는 소스상 'P'만 확인됩니다. 운영 DB에 다른 상태 코드(배송중, 완료 등)가 있습니까?

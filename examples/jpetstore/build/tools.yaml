# automcp 0.1.0 / 2026-10-14T15:33:02Z
# 변경은 IR(mcp-spec.yaml)을 고친 뒤 `automcp compile`로 다시 생성한다.
kind: source
name: jpetstore-db
type: postgres
host: db
port: 5432
database: jpetstore
user: ${MCP_DB_USER}
password: ${MCP_DB_PASSWORD}
---
kind: tool
name: search_products
type: postgres-sql
source: jpetstore-db
description: 상품명을 키워드로 검색한다. 공백으로 구분한 여러 키워드는 OR 조건이며 대소문자를 무시한다. 가격·재고는 get_product_details로 이어서 조회한다.
parameters:
- name: keyword
  type: string
  description: '검색어. 예: ''fish'', ''golden retriever'''
statement: |
  SELECT DISTINCT p.productid AS product_id,
         p.name,
         p.category AS category_id,
         trim(regexp_replace(p.descn, '<[^>]*>', '', 'g')) AS description
  FROM product p
  WHERE lower(p.name) LIKE ANY (
    SELECT '%' || k || '%'
    FROM regexp_split_to_table(lower(trim($1)), '\s+') AS k
    WHERE k <> '')
  ORDER BY p.productid
  LIMIT 50
---
kind: tool
name: get_product_details
type: postgres-sql
source: jpetstore-db
description: 상품 ID로 상품 정보와 판매 단위(item)별 가격, 재고 수량을 한 번에 조회한다. 주문 대리 접수(place_order)에 쓸 item_id도 여기서 얻는다.
parameters:
- name: product_id
  type: string
  description: '상품 ID. 예: ''FI-SW-01'' (search_products 결과의 product_id)'
statement: |
  SELECT p.productid AS product_id,
         p.name,
         i.itemid AS item_id,
         concat_ws(' ', i.attr1, i.attr2, i.attr3, i.attr4, i.attr5) AS variant,
         i.listprice AS list_price,
         v.qty AS stock_qty,
         i.status
  FROM item i
  JOIN product p ON p.productid = i.productid
  LEFT JOIN inventory v ON v.itemid = i.itemid
  WHERE i.productid = $1
  ORDER BY i.itemid
  LIMIT 50
---
kind: tool
name: list_products_by_category
type: postgres-sql
source: jpetstore-db
description: '카테고리의 상품 목록을 가격대(최저·최고가)와 총 재고와 함께 조회한다. category_id는 FISH, DOGS, CATS, REPTILES, BIRDS 중 하나다(대소문자 무시). 예: "강아지
  상품 뭐 있어요?" → DOGS. 상품별 상세는 get_product_details를 쓴다.'
parameters:
- name: category_id
  type: string
  description: '카테고리 ID: FISH, DOGS, CATS, REPTILES, BIRDS 중 하나'
statement: |
  SELECT c.catid AS category_id,
         c.name AS category_name,
         p.productid AS product_id,
         p.name,
         trim(regexp_replace(p.descn, '<[^>]*>', '', 'g')) AS description,
         min(i.listprice) AS min_price,
         max(i.listprice) AS max_price,
         coalesce(sum(v.qty), 0) AS total_stock
  FROM category c
  JOIN product p ON p.category = c.catid
  LEFT JOIN item i ON i.productid = p.productid
  LEFT JOIN inventory v ON v.itemid = i.itemid
  WHERE c.catid = upper(trim($1))
  GROUP BY c.catid, c.name, p.productid, p.name, p.descn
  ORDER BY p.productid
  LIMIT 50
---
kind: tool
name: list_customer_orders
type: postgres-sql
source: jpetstore-db
description: 고객 ID(username)로 주문 목록을 조회한다(주문일 오름차순). 결제수단 정보는 반환하지 않는다. 주문 상세는 get_order로 이어서 조회한다.
parameters:
- name: username
  type: string
  description: '고객 ID. 예: ''j2ee'''
statement: |
  SELECT o.orderid AS order_id,
         o.orderdate AS order_date,
         o.totalprice AS total_price,
         s.status,
         CASE s.status WHEN 'P' THEN '처리 대기(Pending)' ELSE s.status END AS status_name,
         o.courier,
         o.shipcity AS ship_city
  FROM orders o
  JOIN orderstatus s ON s.orderid = o.orderid
  WHERE o.userid = $1
  ORDER BY o.orderdate
  LIMIT 50
---
kind: tool
name: get_order
type: postgres-sql
source: jpetstore-db
description: 주문 번호와 고객 ID로 주문 상세(배송지, 금액, 상태, 주문 품목)를 조회한다. 주문 번호와 고객 ID가 일치하지 않으면 결과가 없다.
parameters:
- name: order_id
  type: integer
  description: '주문 번호. 예: 1000'
- name: username
  type: string
  description: 주문한 고객 ID. 본인 확인용
statement: |
  SELECT o.orderid AS order_id,
         o.userid AS username,
         o.orderdate AS order_date,
         CASE s.status WHEN 'P' THEN '처리 대기(Pending)' ELSE s.status END AS status_name,
         o.totalprice AS total_price,
         json_build_object(
           'name', o.shiptofirstname || ' ' || o.shiptolastname,
           'address', concat_ws(', ', o.shipaddr1, o.shipaddr2, o.shipcity, o.shipstate, o.shipzip, o.shipcountry)
         ) AS ship_to,
         (SELECT json_agg(json_build_object(
                   'line', l.linenum, 'item_id', l.itemid, 'product', p.name,
                   'quantity', l.quantity, 'unit_price', l.unitprice) ORDER BY l.linenum)
            FROM lineitem l
            JOIN item i ON i.itemid = l.itemid
            JOIN product p ON p.productid = i.productid
           WHERE l.orderid = o.orderid) AS lines
  FROM orders o
  JOIN orderstatus s ON s.orderid = o.orderid
  WHERE o.orderid = $1 AND o.userid = $2
  LIMIT 1
---
kind: toolset
name: cs-agent
tools:
- search_products
- get_product_details
- list_products_by_category
- list_customer_orders
- get_order
